server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # 👉 Redirigí TODO lo que no exista a index.html para React Router
  location / {
    try_files $uri /index.html;
  }

  # ✅ Redirigir llamadas al backend
  location /post/ {
    proxy_pass http://spring-backend:8080/post/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /dealer/ {
    proxy_pass http://spring-backend:8080/dealer/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /login {
    proxy_pass http://spring-backend:8080/login;
    proxy_set_header Host $host;
  }

  location /register {
    proxy_pass http://spring-backend:8080/register;
    proxy_set_header Host $host;
  }

  # 🔒 Cache para assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /images/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
